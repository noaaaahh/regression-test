name: "[CI] 시각적 회귀 테스트"

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "packages/vanilla-extract/src/components/**"

jobs:
  visual-regression:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          check-latest: true

      # install pnpm && install dependencies with cache
      - name: Setup corepack
        run: |
          npm i -g corepack@0.31
          corepack enable

      - uses: actions/checkout@v4
        with:
          fetch-depth: 25

      - id: get-store-path
        run: echo STORE_PATH=$(pnpm store path) >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        timeout-minutes: 5
        id: cache-pnpm-store
        with:
          path: ${{ steps.get-store-path.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
            pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install

      - name: Install Playwright Browsers
        run: pnpm vanilla exec playwright install --with-deps
        # run: cd packages/vanilla-extract && npx playwright install chromium firefox webkit msedge --with-deps

      # run Storybook
      - run: pnpm test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ./packages/vanilla-extract/tests/report/

  deploy-report:
    needs: visual-regression
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: ./report/

      - uses: daun/playwright-report-summary@v3
        id: playwright-summary
        with:
          report-file: ./report/index.json
          report-url: "https://google.com"
          create-comment: false

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: ${{ steps.playwright-summary.outputs.summary }}
